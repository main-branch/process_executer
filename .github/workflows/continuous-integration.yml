name: Continuous Integration

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

env:
  # SimpleCov suggests setting the JRuby --debug flag to ensure that coverage
  # results from JRuby are complete.
  JRUBY_OPTS: --debug

# Tested platforms / Ruby versions:
#  - Ubuntu: MRI (3.1, 3.4, 4.0), JRuby (9.4), JRuby (10.0)
#  - Ubuntu 24.04: TruffleRuby (24)
#  - Windows: MRI (3.1)

jobs:
  build:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.operating-system }}

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'release-please--'))

    runs-on: ${{ matrix.operating-system }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.4", "4.0"]
        operating-system: [ubuntu-latest]
        include:
          - ruby: "3.1"
            operating-system: windows-latest
          - ruby: "jruby-9.4"
            operating-system: ubuntu-latest
          - ruby: "jruby-10.0"
            operating-system: ubuntu-latest
            java_version: "21"
          # TruffleRuby 24 has no build for ubuntu-26.04, which ubuntu-latest now
          # selects. Go back to ubuntu-latest when this moves to a TruffleRuby
          # that has one (33.0.1 or later).
          - ruby: "truffleruby-24"
            operating-system: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Install updated version of Java if matrix.java_version is set
      - name: Initialize Java
        if: matrix.java_version
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}

      - name: Initialize Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run rake
        run: bundle exec rake
